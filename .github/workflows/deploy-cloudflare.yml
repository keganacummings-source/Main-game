name: Deploy TURBZ to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    env:
      # Empty until the repository secret exists; the Discord steps below skip themselves then.
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler 3 hit /zones/.../workers/routes on every custom-domain deploy.
          # Tokens without Zone Workers Routes read died with "No access", after the
          # script had already uploaded. 4.143+ skips that check for custom domains.
          wranglerVersion: "4.151.0"
          command: deploy

      # Discord death feed. Needs the DISCORD_BOT_TOKEN repository secret; skipped until it exists.
      - name: Upload the Discord bot token to the worker
        if: ${{ env.DISCORD_BOT_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$DISCORD_BOT_TOKEN" | npx wrangler secret put DISCORD_BOT_TOKEN

      - name: Register the /turbzhere slash command
        if: ${{ env.DISCORD_BOT_TOKEN != '' }}
        run: |
          APP_ID=$(grep -E '^DISCORD_APP_ID' wrangler.toml | sed -E 's/.*"(.*)".*/\1/')
          curl -sS --fail-with-body -X PUT "https://discord.com/api/v10/applications/${APP_ID}/commands" \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" -H "Content-Type: application/json" \
            -d '[{"name":"turbzhere","description":"Post TURBZ deaths (with a GIF of the fallen witch) in this channel.","default_member_permissions":"32","dm_permission":false}]'

